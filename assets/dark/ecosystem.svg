<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .line { stroke: #ffffff; stroke-width: 1; opacity: 0.35; stroke-dasharray: 4 4; }
      .box { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 4px; transition: stroke 0.2s, fill 0.2s; }
      .box-center { fill: #161b22; stroke: #ffffff; stroke-width: 1.5; rx: 4px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 13px; font-weight: 600; fill: #ffffff; letter-spacing: 0.5px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 10px; fill: #8b949e; }
      .meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 10px; fill: #8b949e; letter-spacing: 1px; }
      .domain { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 9px; fill: #58a6ff; letter-spacing: 1.5px; font-weight: 600; }
      .node:hover .box { stroke: #58a6ff; fill: #161b22; cursor: pointer; }
      .node:hover .title { fill: #58a6ff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" class="bg"/>

  <!-- Schematic Top Headers -->
  <text x="40" y="45" class="meta">AI PIPELINE ARCHITECTURE — DATA TO PRODUCTION</text>
  <text x="910" y="45" class="meta">FIG. 01</text>

  <!-- Pipeline Stage Headings -->
  <text x="500" y="72" text-anchor="middle" class="domain">STAGE 03 — DEEP LEARNING CORE</text>
  <text x="210" y="132" text-anchor="middle" class="domain">STAGE 01 — TELEMETRY &amp; EDGE</text>
  <text x="790" y="132" text-anchor="middle" class="domain">STAGE 04 — APIS &amp; RUNTIME</text>
  <text x="210" y="412" text-anchor="middle" class="domain">STAGE 02 — SIGNAL PROCESSING</text>
  <text x="790" y="412" text-anchor="middle" class="domain">STAGE 05 — CLOUD ORCHESTRATION</text>

  <!-- Pipeline Connectors from Center (500, 310) -->
  <path d="M 500 270 L 500 150" class="line"/>
  <path d="M 400 280 L 220 200" class="line"/>
  <path d="M 600 280 L 780 200" class="line"/>
  <path d="M 380 310 L 220 320" class="line"/>
  <path d="M 620 310 L 780 320" class="line"/>
  <path d="M 400 340 L 220 460" class="line"/>
  <path d="M 600 340 L 780 460" class="line"/>

  <!-- Center Node: Hub -->
  <g transform="translate(370, 270)">
    <rect width="260" height="80" class="box-center"/>
    <text x="130" y="38" text-anchor="middle" class="title">ENGINEERING CORE</text>
    <text x="130" y="58" text-anchor="middle" class="sub">Bahçeşehir AI • Software Persona</text>
  </g>

  <!-- Stage 03: Model Architectures -->
  <a xlink:href="https://github.com/youssefzuaiter/NeuroLink" target="_blank" class="node">
    <g transform="translate(370, 90)">
      <rect width="260" height="60" class="box"/>
      <text x="130" y="27" text-anchor="middle" class="title">MODEL ARCHITECTURES</text>
      <text x="130" y="45" text-anchor="middle" class="sub">Autoencoders • Hybrid CNNs • DP</text>
    </g>
  </a>

  <!-- Stage 01: Telemetry & Ingestion -->
  <a xlink:href="https://github.com/youssefzuaiter" target="_blank" class="node">
    <g transform="translate(80, 140)">
      <rect width="260" height="60" class="box"/>
      <text x="130" y="27" text-anchor="middle" class="title">TELEMETRY &amp; SENSORS</text>
      <text x="130" y="45" text-anchor="middle" class="sub">Typing Dynamics • Arduino Hardware</text>
    </g>
  </a>

  <!-- Stage 01B: Vision & Edge Detection -->
  <a xlink:href="https://github.com/youssefzuaiter" target="_blank" class="node">
    <g transform="translate(80, 260)">
      <rect width="260" height="60" class="box"/>
      <text x="130" y="27" text-anchor="middle" class="title">EDGE ARBITRATION</text>
      <text x="130" y="45" text-anchor="middle" class="sub">Webcam Vision • Sensor Interrupts</text>
    </g>
  </a>

  <!-- Stage 02: Signal & Feature Extraction -->
  <a xlink:href="https://github.com/youssefzuaiter" target="_blank" class="node">
    <g transform="translate(80, 430)">
      <rect width="260" height="60" class="box"/>
      <text x="130" y="27" text-anchor="middle" class="title">FEATURE EXTRACTION</text>
      <text x="130" y="45" text-anchor="middle" class="sub">FFT Analysis • Spatial RGB Channels</text>
    </g>
  </a>

  <!-- Stage 04: APIs & Microservices -->
  <a xlink:href="https://github.com/youssefzuaiter" target="_blank" class="node">
    <g transform="translate(660, 140)">
      <rect width="260" height="60" class="box"/>
      <text x="130" y="27" text-anchor="middle" class="title">MICROSERVICES &amp; APIS</text>
      <text x="130" y="45" text-anchor="middle" class="sub">Flask REST Engine • Ingestion Endpoints</text>
    </g>
  </a>

  <!-- Stage 04B: Production Systems -->
  <a xlink:href="https://ottillietuft.com/" target="_blank" class="node">
    <g transform="translate(660, 260)">
      <rect width="260" height="60" class="box"/>
      <text x="130" y="27" text-anchor="middle" class="title">DEPLOYED APPLICATION</text>
      <text x="130" y="45" text-anchor="middle" class="sub">OttilieTuft • Production Serving</text>
    </g>
  </a>

  <!-- Stage 05: Cluster Orchestration -->
  <a xlink:href="https://github.com/youssefzuaiter" target="_blank" class="node">
    <g transform="translate(660, 430)">
      <rect width="260" height="60" class="box"/>
      <text x="130" y="27" text-anchor="middle" class="title">CLUSTER INFRASTRUCTURE</text>
      <text x="130" y="45" text-anchor="middle" class="sub">Kubernetes • MongoDB StatefulSets</text>
    </g>
  </a>

  <!-- Schematic Footer Legend -->
  <text x="40" y="585" class="title">02 PIPELINE MAP</text>
  <text x="730" y="585" class="meta">DASHED LINES — DATA FLOW IN MOTION</text>
</svg>
